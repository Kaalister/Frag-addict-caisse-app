name: Build releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Android release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            app_version="${GITHUB_REF_NAME#v}"
          else
            pubspec_version="$(grep -E '^version:' pubspec.yaml | head -n 1 | sed -E 's/version:[[:space:]]*//')"
            app_version="${pubspec_version%%+*}"
          fi
          clean_version="${app_version%%-*}"
          IFS='.' read -r major minor patch <<< "${clean_version}"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          build_number=$((10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch}))
          if [[ "${build_number}" -lt 2 ]]; then
            build_number=2
          fi
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_STORE_PASSWORD}"
          test -n "${ANDROID_KEY_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"

      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf "%s" "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/tilly-release.jks
          {
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=tilly-release.jks"
          } > android/key.properties

      - name: Restore Firebase monitoring config
        shell: bash
        env:
          TILLY_MONITORING_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.TILLY_MONITORING_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "${TILLY_MONITORING_GOOGLE_SERVICES_JSON_BASE64}"
          printf "%s" "${TILLY_MONITORING_GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: >
          flutter build apk --release
          --build-name "${{ steps.version.outputs.app_version }}"
          --build-number "${{ steps.version.outputs.build_number }}"
          --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }}

      - name: Prepare Android artifact
        shell: bash
        run: |
          mkdir -p dist
          versioned_apk="dist/Tilly-Android-${{ steps.version.outputs.app_version }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${versioned_apk}"
          cp "${versioned_apk}" "dist/Tilly-Android-latest.apk"

      - name: Attach Android APKs to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk

  windows:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $appVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
            $pubspecVersion = $line.Matches[0].Groups[1].Value.Trim()
            $appVersion = $pubspecVersion.Split('+')[0]
          }
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Windows app
        run: >
          flutter build windows --release
          --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }}

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\Tilly-Windows-${{ steps.version.outputs.app_version }}.zip" `
            -Force
          Copy-Item `
            "dist\Tilly-Windows-${{ steps.version.outputs.app_version }}.zip" `
            "dist\Tilly-Windows-latest.zip" `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\tilly.iss
          Copy-Item `
            "dist\TillySetup-${{ steps.version.outputs.app_version }}.exe" `
            "dist\TillySetup-latest.exe" `
            -Force

      - name: Upload Windows artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: tilly-windows-${{ steps.version.outputs.app_version }}
          path: |
            dist\*.zip
            dist\*.exe

      - name: Attach Windows artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist\*.zip
            dist\*.exe

  macos:
    name: macOS release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            app_version="${GITHUB_REF_NAME#v}"
          else
            pubspec_version="$(grep -E '^version:' pubspec.yaml | head -n 1 | sed -E 's/version:[[:space:]]*//')"
            app_version="${pubspec_version%%+*}"
          fi
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build macOS app
        run: >
          flutter build macos --release
          --build-name "${{ steps.version.outputs.app_version }}"
          --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }}

      - name: Package macOS artifacts
        shell: bash
        run: |
          mkdir -p dist/dmg
          ditto \
            -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Tilly.app \
            "dist/Tilly-macOS-${{ steps.version.outputs.app_version }}.zip"
          cp \
            "dist/Tilly-macOS-${{ steps.version.outputs.app_version }}.zip" \
            "dist/Tilly-macOS-latest.zip"
          cp -R build/macos/Build/Products/Release/Tilly.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname Tilly \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            "dist/Tilly-macOS-${{ steps.version.outputs.app_version }}.dmg"
          cp \
            "dist/Tilly-macOS-${{ steps.version.outputs.app_version }}.dmg" \
            "dist/Tilly-macOS-latest.dmg"

      - name: Upload macOS artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: tilly-macos-${{ steps.version.outputs.app_version }}
          path: |
            dist/*.zip
            dist/*.dmg

      - name: Attach macOS artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.dmg
