name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          $pubspecVersion = $line.Matches[0].Groups[1].Value.Trim()
          $appVersion = $pubspecVersion.Split('+')[0]
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Windows app
        run: flutter build windows --release

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\FragsAddictsCaisse-Windows-${{ steps.version.outputs.app_version }}.zip" `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\frags_addicts_caisse.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frags-addicts-caisse-windows-${{ steps.version.outputs.app_version }}
          path: |
            dist\*.zip
            dist\*.exe

      - name: Attach artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\*.zip
            dist\*.exe
